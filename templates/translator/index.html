<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASL Translator</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 2rem auto;
      max-width: 860px;
      padding: 0 1rem;
    }

    .camera-stage {
      position: relative;
      width: min(100%, 800px);
    }

    video,
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    video {
      background: #111;
      transform: scaleX(-1);
    }

    canvas {
      left: 0;
      pointer-events: none;
      position: absolute;
      top: 0;
      transform: scaleX(-1);
    }

    button {
      font-size: 1rem;
      margin: 1rem 0.5rem 0 0;
      padding: 0.6rem 1rem;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .spinner {
      animation: spin 0.8s linear infinite;
      border: 3px solid #d9e2ec;
      border-radius: 50%;
      border-top-color: #2563eb;
      display: inline-block;
      height: 1rem;
      margin-right: 0.4rem;
      vertical-align: -0.15rem;
      width: 1rem;
    }

    .hidden {
      display: none;
    }

    #recognized-word {
      font-size: 2rem;
      font-weight: 700;
      min-height: 2.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  {% csrf_token %}
  <main>
    <h1>ASL Translator</h1>
    <div class="camera-stage">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="landmark-canvas"></canvas>
    </div>
    <p id="status" aria-live="polite">Camera is not started.</p>
    <span id="loading" class="spinner hidden" role="status" aria-label="Predicting"></span>
    <p>Frames: <span id="frame-count">0</span> / 200</p>
    <button id="start-button" type="button">Start Camera</button>
    <button id="predict-button" type="button" disabled>Predict Sign</button>
    <button id="clear-button" type="button">Clear / Reset</button>
    <div id="recognized-word" aria-live="polite"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
  <script>
    (() => {
      "use strict";

      const FRAME_COUNT = 200;
      const POSITION_FEATURE_COUNT = 225;
      const FEATURES_PER_FRAME = 450;
      const POSE_COUNT = 33;
      const HAND_COUNT = 21;
      const buffer = [];
      let previousPosition = null;
      let holistic = null;
      let camera = null;
      let processingFrame = false;
      let isRecording = false;
      let isPredicting = false;

      const video = document.getElementById("webcam");
      const canvas = document.getElementById("landmark-canvas");
      const canvasContext = canvas.getContext("2d");
      const status = document.getElementById("status");
      const frameCount = document.getElementById("frame-count");
      const recognizedWord = document.getElementById("recognized-word");
      const startButton = document.getElementById("start-button");
      const predictButton = document.getElementById("predict-button");
      const clearButton = document.getElementById("clear-button");
      const loading = document.getElementById("loading");

      function setStatus(message) {
        status.textContent = message;
      }

      function zeros(count) {
        return Array.from({ length: count }, () => [0, 0, 0]);
      }

      function readLandmarks(landmarks, count) {
        if (!Array.isArray(landmarks) || landmarks.length < count) {
          return zeros(count);
        }
        return landmarks.slice(0, count).map((landmark) => [
          Number.isFinite(landmark.x) ? landmark.x : 0,
          Number.isFinite(landmark.y) ? landmark.y : 0,
          Number.isFinite(landmark.z) ? landmark.z : 0
        ]);
      }

      function normalizeLandmarks(pose, leftHand, rightHand) {
        const leftShoulder = pose[11];
        const rightShoulder = pose[12];
        const center = [
          (leftShoulder[0] + rightShoulder[0]) / 2,
          (leftShoulder[1] + rightShoulder[1]) / 2,
          (leftShoulder[2] + rightShoulder[2]) / 2
        ];
        const shoulderWidth = Math.hypot(
          leftShoulder[0] - rightShoulder[0],
          leftShoulder[1] - rightShoulder[1]
        );
        const scale = shoulderWidth > 1e-6 ? shoulderWidth : 1;
        return [...pose, ...leftHand, ...rightHand].flatMap((point) =>
          point.map((value, axis) => (value - center[axis]) / scale)
        );
      }

      function buildFeatureFrame(results) {
        const pose = readLandmarks(results.poseLandmarks, POSE_COUNT);
        const leftHand = readLandmarks(results.leftHandLandmarks, HAND_COUNT);
        const rightHand = readLandmarks(results.rightHandLandmarks, HAND_COUNT);
        const position = normalizeLandmarks(pose, leftHand, rightHand);

        if (position.length !== POSITION_FEATURE_COUNT) {
          throw new Error("The position vector must contain exactly 225 values.");
        }

        const velocity = previousPosition === null
          ? new Array(POSITION_FEATURE_COUNT).fill(0)
          : position.map((value, index) => value - previousPosition[index]);
        previousPosition = position;

        const frame = position.concat(velocity);
        if (frame.length !== FEATURES_PER_FRAME) {
          throw new Error("The frame vector must contain exactly 450 values.");
        }
        return frame;
      }

      function drawResults(results) {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        canvasContext.clearRect(0, 0, canvas.width, canvas.height);
        if (results.poseLandmarks) {
          drawConnectors(canvasContext, results.poseLandmarks, POSE_CONNECTIONS, {
            color: "#00ff00",
            lineWidth: 2
          });
          drawLandmarks(canvasContext, results.poseLandmarks, {
            color: "#ff0000",
            lineWidth: 1,
            radius: 2
          });
        }
        if (results.leftHandLandmarks) {
          drawConnectors(canvasContext, results.leftHandLandmarks, HAND_CONNECTIONS, {
            color: "#00aaff",
            lineWidth: 2
          });
          drawLandmarks(canvasContext, results.leftHandLandmarks, {
            color: "#00aaff",
            lineWidth: 1,
            radius: 2
          });
        }
        if (results.rightHandLandmarks) {
          drawConnectors(canvasContext, results.rightHandLandmarks, HAND_CONNECTIONS, {
            color: "#ffaa00",
            lineWidth: 2
          });
          drawLandmarks(canvasContext, results.rightHandLandmarks, {
            color: "#ffaa00",
            lineWidth: 1,
            radius: 2
          });
        }
      }

      function handleResults(results) {
        drawResults(results);
        if (!isRecording || processingFrame || buffer.length >= FRAME_COUNT) {
          return;
        }
        processingFrame = true;
        try {
          buffer.push(buildFeatureFrame(results));
          console.log("Extracted frame shape:", [buffer[buffer.length - 1].length]);
          frameCount.textContent = String(buffer.length);
          predictButton.disabled = buffer.length !== FRAME_COUNT;
          setStatus(
            buffer.length === FRAME_COUNT
              ? "Exactly 200 frames captured. Ready to predict."
              : "Capturing landmarks..."
          );
        } catch (error) {
          setStatus(`Landmark error: ${error.message}`);
        } finally {
          processingFrame = false;
        }
      }

      function getCookie(name) {
        const prefix = `${name}=`;
        const cookie = document.cookie
          .split(";")
          .map((item) => item.trim())
          .find((item) => item.startsWith(prefix));
        if (cookie) {
          return decodeURIComponent(cookie.slice(prefix.length));
        }
        const tokenInput = document.querySelector("[name=csrfmiddlewaretoken]");
        return tokenInput ? tokenInput.value : "";
      }

      function stopRecording() {
        isRecording = false;
        if (camera !== null) {
          camera.stop();
          camera = null;
        }
        startButton.disabled = false;
      }

      async function predictSign() {
        if (isPredicting || buffer.length !== FRAME_COUNT) {
          setStatus("Capture exactly 200 frames before predicting.");
          return;
        }
        stopRecording();
        const inputBatch = [buffer.map((frame) => frame.slice())];
        if (
          inputBatch.length !== 1 ||
          inputBatch[0].length !== FRAME_COUNT ||
          inputBatch[0].some((frame) => frame.length !== FEATURES_PER_FRAME)
        ) {
          setStatus("Invalid input shape; expected [1, 200, 450].");
          return;
        }
        console.log("Input batch shape:", [
          inputBatch.length,
          inputBatch[0].length,
          inputBatch[0][0].length
        ]);
        isPredicting = true;
        predictButton.disabled = true;
        loading.classList.remove("hidden");
        setStatus("Running inference...");
        try {
          const requestStartedAt = performance.now();
          const response = await fetch("/api/predict/", {
            method: "POST",
            credentials: "same-origin",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCookie("csrftoken")
            },
            body: JSON.stringify({ sequence: inputBatch })
          });
          console.log(
            "Network round-trip:",
            `${(performance.now() - requestStartedAt).toFixed(2)} ms`
          );
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Prediction request failed.");
          }
          recognizedWord.textContent =
            `${result.word} (${(Number(result.confidence) * 100).toFixed(1)}%)`;
          console.log("API returned:", result.word, result.confidence);
          setStatus("Prediction complete.");
        } catch (error) {
          setStatus(`Prediction error: ${error.message}`);
        } finally {
          isPredicting = false;
          loading.classList.add("hidden");
          predictButton.disabled = buffer.length !== FRAME_COUNT;
        }
      }

      async function clearBuffer() {
        const restart = isRecording;
        stopRecording();
        buffer.length = 0;
        previousPosition = null;
        frameCount.textContent = "0";
        recognizedWord.textContent = "";
        predictButton.disabled = true;
        setStatus("Buffer cleared.");
        if (restart) {
          await startCamera();
        }
      }

      async function startCamera() {
        if (camera !== null) {
          return;
        }
        holistic = new Holistic({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
        });
        holistic.setOptions({
          modelComplexity: 1,
          smoothLandmarks: true,
          enableSegmentation: false,
          smoothSegmentation: false,
          refineFaceLandmarks: false,
          minDetectionConfidence: 0.5,
          minTrackingConfidence: 0.5
        });
        holistic.onResults(handleResults);
        camera = new Camera(video, {
          onFrame: async () => {
            console.time("MediaPipe extraction");
            await holistic.send({ image: video });
            console.timeEnd("MediaPipe extraction");
          },
          width: 640,
          height: 480
        });
        try {
          await camera.start();
          isRecording = true;
          startButton.disabled = true;
          setStatus("Camera running. Capturing landmarks...");
        } catch (error) {
          camera = null;
          setStatus(`Camera error: ${error.message}`);
        }
      }

      startButton.addEventListener("click", startCamera);
      predictButton.addEventListener("click", predictSign);
      clearButton.addEventListener("click", clearBuffer);
    })();
  </script>
</body>
</html>
